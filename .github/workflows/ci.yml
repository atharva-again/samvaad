name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Workspace tests, types, and builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm --filter @samvaad/db build
          pnpm --filter @samvaad/voice-protocol build

      - name: Vite+ checks
        run: pnpm exec vp check

      - name: Test
        env:
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
        run: pnpm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:18765
        run: pnpm build
